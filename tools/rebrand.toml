to   = "accounts.invalid"
[[rule]]
from = "auth.x.ai"
to   = "auth.invalid"
[[rule]]
from = "api.x.ai"
to   = "api.invalid"
[[rule]]
from = "API.X.AI"
to   = "API.INVALID"
[[rule]]
from = "X.AI"
to   = "BCODE.INVALID"
[[rule]]
from = "console.x.ai"
to   = "console.invalid"
[[rule]]
from = "media.x.ai"
to   = "media.invalid"
[[rule]]
from = "docs.x.ai"
to   = "docs.invalid"
[[rule]]
from = "grok.com"
to   = "bcode.invalid"
[[rule]]
from = "x.ai"
to   = "bcode.invalid"
# macOS MDM preference domain.
[[rule]]
from = "ai.x.grok"
to   = "dev.bcode.cli"

# --- Crate and module identifiers ------------------------------------------
