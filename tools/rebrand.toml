from = "cli-chat-proxy.grok.com"
to   = "cli-chat-proxy.invalid"
[[rule]]
from = "assets.grok.com"
to   = "assets.invalid"
[[rule]]
from = "code.grok.com"
to   = "code.invalid"
[[rule]]
