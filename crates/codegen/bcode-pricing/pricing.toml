# Built-in rate card. USD per 1,000,000 tokens.
# Override any model with a [pricing."<model-id>"] block in ~/.bcode/config.toml.
#
# Model ids are QUOTED. An unquoted [pricing.gpt-5.2-codex] is a dotted TOML key
# and silently becomes pricing.gpt-5."2-codex", which parses fine and prices
# nothing.
#
# Locally computed cost is an ESTIMATE. A provider that reports its own price
# always wins; this table only fills the gap for those that do not.
#
# DeepSeek verified against api-docs.deepseek.com (2026-09-06): peak is
# 01:00-04:00 and 06:00-10:00 UTC Monday-Friday, and off-peak is exactly half.
# The base card is therefore OFF-PEAK with peak expressed as multiplier = 2.0.
# Stating it that way keeps both peak blocks inside a single day: the equivalent
# off-peak windows would wrap midnight, and a wrapping window that carries a
# weekday filter mishandles Monday 00:00-01:00, which is off-peak but whose
# window began on Sunday.

[pricing."deepseek-v4-pro"]
input = 0.66          # cache miss, off-peak
output = 1.98
cache_read = 0.022

[[pricing."deepseek-v4-pro".window]]
start = "01:00"
end = "04:00"
days = ["mon", "tue", "wed", "thu", "fri"]
multiplier = 2.0

[[pricing."deepseek-v4-pro".window]]
start = "06:00"
end = "10:00"
days = ["mon", "tue", "wed", "thu", "fri"]
multiplier = 2.0

[pricing."deepseek-v4-flash"]
input = 0.22
output = 0.66
cache_read = 0.007

[[pricing."deepseek-v4-flash".window]]
start = "01:00"
end = "04:00"
days = ["mon", "tue", "wed", "thu", "fri"]
multiplier = 2.0

[[pricing."deepseek-v4-flash".window]]
start = "06:00"
end = "10:00"
days = ["mon", "tue", "wed", "thu", "fri"]
multiplier = 2.0

[pricing."deepseek-v4-flash-vision-exp"]
input = 0.22
output = 0.66
cache_read = 0.007

[[pricing."deepseek-v4-flash-vision-exp".window]]
start = "01:00"
end = "04:00"
days = ["mon", "tue", "wed", "thu", "fri"]
multiplier = 2.0

[[pricing."deepseek-v4-flash-vision-exp".window]]
start = "06:00"
end = "10:00"
days = ["mon", "tue", "wed", "thu", "fri"]
multiplier = 2.0

# xAI verified against docs.x.ai (2026-09-06). No time-of-use pricing, but a
# documented context tier: rates double at >= 200k prompt tokens.
[pricing."grok-4.6"]
input = 2.00
output = 6.00
cache_read = 0.50

[[pricing."grok-4.6".tier]]
over_tokens = 200000
input = 4.00
output = 12.00
cache_read = 1.00

# OpenAI is deliberately ABSENT.
#
# Their published card has short- and long-context tiers (gpt-5.6-terra: $2.00
# input / $0.20 cached / $12.00 output short, $4.00 / $0.40 / $18.00 long) but
# does not document the token boundary between them, and the boundary is the
# whole point: guess it too high and every long request is billed at half rate.
#
# A model with no entry here reports its cost as UNKNOWN, which the UI shows as
# unknown rather than as zero. That is the correct outcome -- an honest gap beats
# a confident wrong number in something a budget is enforced against.
#
# To price OpenAI locally, add a [pricing."<id>"] block with the tier boundary
# your account actually bills at.
