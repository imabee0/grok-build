[package]
license = "Apache-2.0"
name = "bcode-update"
version = "0.1.220-alpha.4"
edition.workspace = true

[dependencies]
dunce = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
bcode-extra-ca = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "time"] }
tracing = { workspace = true }
url = { workspace = true }
bcode-dirs = { workspace = true }
bcode-shell = { workspace = true }
bcode-telemetry = { workspace = true }
bcode-tools = { workspace = true }
bcode-version = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
semver = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
